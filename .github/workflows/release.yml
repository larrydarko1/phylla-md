# Releasing is driven by package.json, not by pushing a tag by hand: land a `bump: version x.y.z`
# commit on main, and once CI goes green this workflow tags it, builds the installers and publishes
# the release.
# The idempotency check keys on a *published* release, not on the tag: the tag is created before the
# builds run, so keying on the tag would make every failed run unresumable — a re-run would find the
# tag, decide there was nothing to do, and quietly skip.
#
# It hangs off `workflow_run` rather than `push` so a red CI can never produce a release.

name: Release

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # ── Read version and decide whether there is anything to release ──
    version:
        name: Resolve version
        if: >
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_repository.full_name == github.repository
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            version: ${{ steps.pkg.outputs.version }}
            tag: ${{ steps.pkg.outputs.tag }}
            exists: ${{ steps.check.outputs.exists }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  persist-credentials: false

            - name: Read version from package.json
              id: pkg
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Version: $VERSION"

            - name: Check if release already published
              id: check
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ steps.pkg.outputs.tag }}
              run: |
                  DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo "missing")
                  if [ "$DRAFT" = "false" ]; then
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                      echo "Release $TAG is already published, skipping"
                  else
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                      echo "No published release for $TAG (state: $DRAFT), will release"
                  fi

    # ── Tag the commit and open a draft release for the builds to upload into ──
    prepare:
        name: Tag and open draft
        needs: version
        if: needs.version.outputs.exists == 'false'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            # This job pushes the tag, so it is the one checkout that keeps its credentials.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            # A retry of a failed release re-enters this job with the tag already pushed.
            - name: Create tag
              env:
                  TAG: ${{ needs.version.outputs.tag }}
              run: |
                  if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
                      echo "Tag $TAG already exists, reusing it"
                      exit 0
                  fi
                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"
                  git tag -a "$TAG" -m "Release $TAG"
                  git push origin "$TAG"

            - name: Create draft release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  tag_name: ${{ needs.version.outputs.tag }}
                  name: Phylla ${{ needs.version.outputs.tag }}
                  draft: true
                  prerelease: false
                  generate_release_notes: true
                  body: |
                      ## Phylla does not update itself

                      Nothing phones home and nothing installs behind your back — which also means Phylla
                      will never tell you a new version exists. To upgrade, download from this page and
                      replace your copy. Watch this repository if you want to hear about new releases.

                      ## Installing

                      Releases carry Linux packages only.

                      - **AppImage** — `chmod +x` the file, then run it.
                      - **deb / rpm** — install with your package manager.
                      - **tar.gz** — extract anywhere and run the `phylla` binary inside.

                      ## macOS and Windows

                      Not shipped: signed binaries need paid certificates, and unsigned ones get
                      warned about or blocked by the OS. Both build fine from source with no
                      signature needed — `npm ci && npm run build:mac` or `npm run build:win` —
                      but are untested. Proper support is planned as the project grows. See the
                      [README](https://github.com/larrydarko1/phylla-md#other-platforms).

    # ── Installers ────────────────────────────────────────
    # Linux only: macOS and Windows need paid signing certificates to ship without OS warnings. Their
    # targets stay in package.json for self-builds. Still a matrix so adding one back is one entry.
    build:
        name: Build ${{ matrix.name }}
        needs: [version, prepare]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 40
        permissions:
            contents: write

        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Linux packages
                      os: ubuntu-24.04
                      script: build:linux
                      assets: dist-electron/*.AppImage dist-electron/*.deb dist-electron/*.rpm dist-electron/*.tar.gz

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  persist-credentials: false

            - uses: ./.github/actions/node-setup

            - uses: ./.github/actions/whisper-model

            - name: Install rpm tooling
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y rpm

            - name: Build installer
              run: npm run ${{ matrix.script }}

            - name: Upload to draft release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ needs.version.outputs.tag }}
                  ASSETS: ${{ matrix.assets }}
              run: |
                  set -euo pipefail
                  # shellcheck disable=SC2086
                  ls -lh $ASSETS
                  # shellcheck disable=SC2086
                  gh release upload "$TAG" $ASSETS --clobber

    # ── Publish ────────────────────────────────────────────
    publish:
        name: Publish release
        needs: [version, build]
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - name: Flip draft to published
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ needs.version.outputs.tag }}
              run: gh release edit "$TAG" --draft=false
