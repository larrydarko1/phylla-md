# The `setup-node` + `npm ci` preamble that every Node job in this repo opens with, in one place.

name: Node setup
description: Install Node 24 with an npm cache and restore dependencies from the lockfile.

inputs:
    ignore-scripts:
        description: >
            Skip lifecycle scripts during install. Set this for jobs that only need JavaScript on disk
            (linting a PR title, for example) — it avoids the onnxruntime postinstall download, which
            is the bulk of a cold `npm ci`. Never set it for build or test jobs: those need the native
            binaries the postinstalls fetch. Electron is no longer part of that trade-off — since
            Electron 42 the binary is fetched on first run rather than by a postinstall, and
            electron-builder downloads its own copy when packaging.
        required: false
        default: 'false'

runs:
    using: composite

    steps:
        - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
          with:
              node-version: 24
              cache: npm

        - name: Install dependencies
          run: npm ci ${{ inputs.ignore-scripts == 'true' && '--ignore-scripts' || '' }}
          shell: bash
